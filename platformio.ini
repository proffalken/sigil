; PlatformIO project file for running Sigil's native unit tests.
;
; This does not build the library for any real board — that's what
; examples/BasicDevice/platformio.ini is for. `pio test -e native` compiles
; and runs test/ against src/ on the host machine, using ArduinoFake to
; stand in for the Arduino core.

[env:native]
platform = native
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    fabiobatsilva/ArduinoFake@^0.4.0
test_framework = unity
build_flags = -std=gnu++17
